# Builds and tests the backend and frontend on every push to main and every pull request into main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch or PR cancels the run that is still going for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow's token can only read the repo; nothing here needs to write.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # reuse downloaded dependencies between runs

      # verify = compile, unit tests, integration tests (Testcontainers starts Postgres in the runner's Docker), package.
      # -B (batch mode) gives a plain log without download progress bars.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json lists, and fails if it is out of date with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-checks with tsc, then builds the production bundle into dist/.
      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
