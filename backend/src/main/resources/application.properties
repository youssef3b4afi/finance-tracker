spring.application.name=finance-tracker
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_tracker
spring.datasource.username=${DB_USERNAME:finance}
spring.datasource.password=${DB_PASSWORD:finance}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Lazy relations may only be loaded inside a service @Transactional method, never while writing the HTTP response.
spring.jpa.open-in-view=false
server.port=8081
# JWT: HS256 needs a secret of at least 32 bytes. Set JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl=PT8H
